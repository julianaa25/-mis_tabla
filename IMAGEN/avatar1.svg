<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgLion" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#FDCB6E"/>
    </radialGradient>
    <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E17055"/>
      <stop offset="100%" stop-color="#D63031"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#FAB1A0"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFF3A8"/>
      <stop offset="100%" stop-color="#FFA502"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgLion)" stroke="#E17055" stroke-width="4" filter="url(#shadow1)"/>
  
  <!-- Fluffy Mane (outer petals) -->
  <g fill="url(#maneGrad)">
    <circle cx="100" cy="46" r="26"/>
    <circle cx="140" cy="56" r="26"/>
    <circle cx="164" cy="92" r="26"/>
    <circle cx="160" cy="132" r="26"/>
    <circle cx="132" cy="162" r="26"/>
    <circle cx="100" cy="170" r="26"/>
    <circle cx="68" cy="162" r="26"/>
    <circle cx="40" cy="132" r="26"/>
    <circle cx="36" cy="92" r="26"/>
    <circle cx="60" cy="56" r="26"/>
  </g>

  <!-- Ears -->
  <circle cx="62" cy="66" r="16" fill="#E17055"/>
  <circle cx="62" cy="66" r="10" fill="#FAB1A0"/>
  <circle cx="138" cy="66" r="16" fill="#E17055"/>
  <circle cx="138" cy="66" r="10" fill="#FAB1A0"/>

  <!-- Face -->
  <ellipse cx="100" cy="112" rx="54" ry="48" fill="url(#faceGrad)"/>

  <!-- Cheeks -->
  <ellipse cx="68" cy="122" rx="10" ry="7" fill="#FF7675" opacity="0.6"/>
  <ellipse cx="132" cy="122" rx="10" ry="7" fill="#FF7675" opacity="0.6"/>

  <!-- Muzzle -->
  <ellipse cx="100" cy="126" rx="22" ry="17" fill="#FFFFFF"/>
  <path d="M92,118 L108,118 C106,126 94,126 92,118 Z" fill="#2D3436"/>
  <!-- Smile -->
  <path d="M100,123 L100,132 Q100,138 94,136 M100,132 Q100,138 106,136" stroke="#2D3436" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="78" cy="102" rx="8" ry="10" fill="#2D3436"/>
  <ellipse cx="122" cy="102" rx="8" ry="10" fill="#2D3436"/>
  <!-- Eye highlights -->
  <circle cx="75" cy="99" r="3" fill="#FFFFFF"/>
  <circle cx="81" cy="104" r="1.5" fill="#FFFFFF"/>
  <circle cx="119" cy="99" r="3" fill="#FFFFFF"/>
  <circle cx="125" cy="104" r="1.5" fill="#FFFFFF"/>

  <!-- Little Crown -->
  <polygon points="80,56 90,70 100,52 110,70 120,56 116,74 84,74" fill="url(#crownGrad)" stroke="#E67E22" stroke-width="1.5"/>
  <circle cx="80" cy="56" r="3" fill="#E74C3C"/>
  <circle cx="100" cy="52" r="3.5" fill="#0984E3"/>
  <circle cx="120" cy="56" r="3" fill="#00B894"/>
</svg>
