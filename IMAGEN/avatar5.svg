<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgSpace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E272C"/>
      <stop offset="100%" stop-color="#0F141C"/>
    </radialGradient>
    <linearGradient id="helmetGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74B9FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0984E3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#A29BFE" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shadowAstro" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Space Circle with Little Stars -->
  <circle cx="100" cy="100" r="92" fill="url(#bgSpace)" stroke="#74B9FF" stroke-width="4" filter="url(#shadowAstro)"/>
  <circle cx="45" cy="45" r="1.5" fill="#FFEAA7"/>
  <circle cx="155" cy="45" r="2" fill="#FFEAA7"/>
  <circle cx="35" cy="115" r="1.5" fill="#FFFFFF"/>
  <circle cx="165" cy="125" r="1.5" fill="#FFFFFF"/>
  <circle cx="140" cy="160" r="2" fill="#FFEAA7"/>

  <!-- Bunny Ears (Outside Helmet or inside) -->
  <g>
    <!-- Left Ear -->
    <ellipse cx="68" cy="45" rx="14" ry="32" fill="#FFFFFF" stroke="#DFE6E9" stroke-width="2" transform="rotate(-15 68 45)"/>
    <ellipse cx="68" cy="45" rx="7" ry="22" fill="#FF7675" opacity="0.6" transform="rotate(-15 68 45)"/>
    <!-- Right Ear -->
    <ellipse cx="132" cy="45" rx="14" ry="32" fill="#FFFFFF" stroke="#DFE6E9" stroke-width="2" transform="rotate(15 132 45)"/>
    <ellipse cx="132" cy="45" rx="7" ry="22" fill="#FF7675" opacity="0.6" transform="rotate(15 132 45)"/>
  </g>

  <!-- Spacesuit Collar / Shoulders -->
  <ellipse cx="100" cy="165" rx="55" ry="25" fill="#DFE6E9"/>
  <rect x="70" y="152" width="60" height="15" fill="#0984E3" rx="5"/>
  <circle cx="85" cy="160" r="3.5" fill="#00B894"/>
  <circle cx="100" cy="160" r="3.5" fill="#FDCB6E"/>
  <circle cx="115" cy="160" r="3.5" fill="#D63031"/>

  <!-- Astronaut Helmet Base (Outer Rim) -->
  <circle cx="100" cy="110" r="54" fill="#FFFFFF" stroke="#74B9FF" stroke-width="3.5"/>

  <!-- Bunny Face Inside Helmet -->
  <ellipse cx="100" cy="116" rx="42" ry="36" fill="#F5F6FA"/>
  
  <!-- Cheeks -->
  <circle cx="76" cy="124" r="7" fill="#FF7675" opacity="0.65"/>
  <circle cx="124" cy="124" r="7" fill="#FF7675" opacity="0.65"/>

  <!-- Nose -->
  <polygon points="100,126 96,120 104,120" fill="#E84393"/>
  <!-- Smile -->
  <path d="M100,126 L100,131 Q100,135 95,133 M100,131 Q100,135 105,133" stroke="#2D3436" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="82" cy="112" rx="7" ry="9" fill="#2D3436"/>
  <ellipse cx="118" cy="112" rx="7" ry="9" fill="#2D3436"/>
  <!-- Highlights -->
  <circle cx="80" cy="109" r="3" fill="#FFFFFF"/>
  <circle cx="84" cy="114" r="1.5" fill="#FFFFFF"/>
  <circle cx="116" cy="109" r="3" fill="#FFFFFF"/>
  <circle cx="120" cy="114" r="1.5" fill="#FFFFFF"/>

  <!-- Glass Visor Reflection Overlay -->
  <circle cx="100" cy="110" r="48" fill="url(#helmetGlass)" stroke="#74B9FF" stroke-width="1.5"/>
  <path d="M68,85 Q100,74 132,85 Q125,78 100,72 Q75,78 68,85 Z" fill="#FFFFFF" opacity="0.5"/>
  <ellipse cx="78" cy="94" rx="8" ry="4" fill="#FFFFFF" opacity="0.4" transform="rotate(-30 78 94)"/>

  <!-- Helmet Antenna -->
  <rect x="98" y="52" width="4" height="12" fill="#DFE6E9"/>
  <circle cx="100" cy="50" r="5" fill="#E84393"/>
</svg>
