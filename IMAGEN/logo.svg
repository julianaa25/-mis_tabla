<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#FFA502"/>
      <stop offset="100%" stop-color="#2ED573"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Cute Star Mascot beside logo -->
  <g transform="translate(15, 10)">
    <polygon points="25,2 32,17 48,19 36,31 40,47 25,38 10,47 14,31 2,19 18,17" fill="#FFD32A" stroke="#FFA801" stroke-width="2"/>
    <!-- Face on star -->
    <circle cx="20" cy="23" r="2.5" fill="#2C3E50"/>
    <circle cx="30" cy="23" r="2.5" fill="#2C3E50"/>
    <circle cx="19" cy="22" r="1" fill="#FFFFFF"/>
    <circle cx="29" cy="22" r="1" fill="#FFFFFF"/>
    <circle cx="16" cy="27" r="2.5" fill="#FF7675" opacity="0.6"/>
    <circle cx="34" cy="27" r="2.5" fill="#FF7675" opacity="0.6"/>
    <path d="M22,27 Q25,31 28,27" stroke="#2C3E50" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Text "Mis Tablas" with 3D child-friendly look -->
  <text x="75" y="48" font-family="'Fredoka', 'Quicksand', 'Arial Black', sans-serif" font-weight="900" font-size="40" fill="#2F3542">Mis Tablas</text>
  <text x="73" y="46" font-family="'Fredoka', 'Quicksand', 'Arial Black', sans-serif" font-weight="900" font-size="40" fill="url(#logoGrad)">Mis Tablas</text>

  <!-- Tagline -->
  <text x="75" y="68" font-family="'Quicksand', 'Nunito', sans-serif" font-weight="700" font-size="13" fill="#57606F" letter-spacing="1">¡APRENDE, JUEGA Y GANA!</text>

  <!-- Math sparks -->
  <text x="275" y="32" font-family="sans-serif" font-weight="bold" font-size="22" fill="#3742FA">×</text>
  <text x="295" y="55" font-family="sans-serif" font-weight="bold" font-size="20" fill="#FF4757">=</text>
  <text x="278" y="70" font-family="sans-serif" font-weight="bold" font-size="18" fill="#2ED573">÷</text>
</svg>
