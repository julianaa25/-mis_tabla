<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgPanda" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#80DEEA"/>
    </radialGradient>
    <filter id="shadowPanda" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#bgPanda)" stroke="#00ACC1" stroke-width="4" filter="url(#shadowPanda)"/>

  <!-- Ears -->
  <circle cx="50" cy="55" r="22" fill="#2D3436"/>
  <circle cx="150" cy="55" r="22" fill="#2D3436"/>
  <circle cx="50" cy="55" r="12" fill="#636E72"/>
  <circle cx="150" cy="55" r="12" fill="#636E72"/>

  <!-- Head -->
  <circle cx="100" cy="115" r="58" fill="#FFFFFF" stroke="#DFE6E9" stroke-width="2"/>

  <!-- Eye Patches (Panda spots) -->
  <ellipse cx="72" cy="106" rx="16" ry="19" fill="#2D3436" transform="rotate(-15 72 106)"/>
  <ellipse cx="128" cy="106" rx="16" ry="19" fill="#2D3436" transform="rotate(15 128 106)"/>

  <!-- Eyes -->
  <ellipse cx="74" cy="104" rx="7" ry="9" fill="#FFFFFF"/>
  <ellipse cx="126" cy="104" rx="7" ry="9" fill="#FFFFFF"/>
  <circle cx="75" cy="105" r="4.5" fill="#0984E3"/>
  <circle cx="125" cy="105" r="4.5" fill="#0984E3"/>
  <circle cx="73" cy="103" r="1.8" fill="#FFFFFF"/>
  <circle cx="123" cy="103" r="1.8" fill="#FFFFFF"/>

  <!-- Smart Round Glasses -->
  <circle cx="72" cy="105" r="20" fill="none" stroke="#E17055" stroke-width="3.5"/>
  <circle cx="128" cy="105" r="20" fill="none" stroke="#E17055" stroke-width="3.5"/>
  <path d="M92,105 Q100,99 108,105" stroke="#E17055" stroke-width="3.5" fill="none"/>

  <!-- Cheeks -->
  <ellipse cx="56" cy="132" rx="9" ry="6" fill="#FF7675" opacity="0.6"/>
  <ellipse cx="144" cy="132" rx="9" ry="6" fill="#FF7675" opacity="0.6"/>

  <!-- Cute Panda Nose -->
  <ellipse cx="100" cy="128" rx="8" ry="6" fill="#2D3436"/>

  <!-- Smile -->
  <path d="M100,134 L100,140 Q100,146 94,144 M100,140 Q100,146 106,144" stroke="#2D3436" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Bamboo Sprout on Head -->
  <g transform="translate(100, 48)">
    <path d="M0,14 Q2,4 12,2 Q6,12 0,14 Z" fill="#00B894"/>
    <path d="M0,14 Q-2,4 -12,2 Q-6,12 0,14 Z" fill="#55EFC4"/>
    <rect x="-1.5" y="10" width="3" height="8" fill="#00B894" rx="1.5"/>
  </g>
</svg>
